name: vigia
on:
  schedule: [{cron: "3-58/5 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: vigia, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python vigia_promos.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - run: |
          git config user.name vigia && git config user.email vigia@users.noreply.github.com
          git add vigia_visto.json
          git diff --cached --quiet && exit 0
          git commit -qm "estado"
          for i in 1 2 3; do git pull --rebase -q -X ours && git push -q && exit 0; sleep 3; done
          echo "nao conseguiu salvar estado"
